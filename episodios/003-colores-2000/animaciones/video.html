<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>vosteacordás? — 003 Colores de los 2000</title>
<style>
/* Episodio 003 — Colores de los 2000. Lienzo 1080x1920, 30 fps.
   Todo se dibuja desde render(t): sin animaciones CSS, para poder grabar cuadro a cuadro.
   Paleta y tipografía: estilo/tokens.css (fuentes locales: Fira Sans / Open Sans / DejaVu Sans). */
:root{--cielo-profundo:#0e466b;--cielo:#1a82cc;--cielo-claro:#519bf5;--cielo-brillo:#8be3fe;--cian:#22adf8;--cian-glow:#4fcff5;
--verde-colina:#80cd05;--verde-aero:#96d076;--verde-agua:#66c3af;--menta:#ccf4c8;--azul-barra:#2c5e95;
--t:"Fira Sans",sans-serif;--ui:"Open Sans",sans-serif;--xp:"DejaVu Sans",Verdana,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--t)}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.abs{position:absolute}
.cielo{position:absolute;inset:0;background:linear-gradient(180deg,#3f8ef0 0%,var(--cielo) 38%,var(--cielo-brillo) 74%,#e9fbff 100%)}
.paisaje{position:absolute;left:0;right:0;bottom:0;width:1080px;height:820px}
.vista{position:absolute;inset:0;background:linear-gradient(150deg,#0b4a63 0%,#1f8fa8 30%,var(--verde-agua) 55%,#b9f0d8 72%,#167f99 100%)}
.negro{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#1b1d22 0%,#050506 75%)}
.ruido{position:absolute;inset:-200px;pointer-events:none;mix-blend-mode:screen;opacity:.16}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px);pointer-events:none}
.burbuja{position:absolute;border-radius:50%;
 background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,.28) 23%,rgba(150,235,255,.14) 60%,rgba(255,255,255,.55) 100%);
 box-shadow:inset 0 0 18px rgba(255,255,255,.65),0 0 10px rgba(255,255,255,.25)}
/* texto glossy */
.gl{background:linear-gradient(180deg,#fff 0%,#fff 46%,#dce9e0 54%,#c2d3c6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 6px 10px rgba(0,40,60,.45));line-height:.95;text-align:center;white-space:nowrap}
.gl.cromo{background-image:linear-gradient(180deg,#fff 0%,#f2f2f2 47%,#aeb9c1 53%,#eef2f5 100%)}
/* XP */
.xp{position:absolute;background:#ece9d8;border:2px solid #0831d9;border-radius:16px 16px 0 0;font-family:var(--xp);
 box-shadow:0 26px 60px rgba(0,0,0,.55);overflow:hidden}
.xp .tb{height:60px;display:flex;align-items:center;padding:0 10px 0 18px;color:#fff;font-weight:700;font-size:26px;text-shadow:2px 2px #0a246a;
 background:linear-gradient(180deg,#0997ff 0%,#0053ee 12%,#0050ee 50%,#0066ff 88%,#0055e6 100%)}
.xp .x{margin-left:auto;width:44px;height:44px;border:2px solid #fff;border-radius:6px;display:grid;place-items:center;font-size:28px;
 background:linear-gradient(180deg,#e7835f,#d24120)}
.xp .bd{display:flex;gap:28px;align-items:center;padding:36px 36px 22px;font-size:27px;color:#000;line-height:1.35}
.xp .bt{display:flex;justify-content:center;gap:22px;padding:6px 0 30px}
.xp button{font:26px var(--xp);min-width:200px;height:56px;border-radius:6px;border:2px solid #003c74;
 background:linear-gradient(180deg,#fff,#ece9d8 85%,#d6d0c5);color:#000}
.xp button.on{background:linear-gradient(180deg,#d6d0c5,#ece9d8 30%,#fff);box-shadow:inset 0 0 0 3px #f5c86a}
.xp button.hov{box-shadow:inset 0 0 0 3px #f5c86a}
/* Aero */
.ae{position:absolute;border-radius:14px;padding:0 12px 12px;background:rgba(215,240,250,.40);backdrop-filter:blur(18px);
 box-shadow:0 30px 70px rgba(0,30,60,.45),inset 0 0 0 2px rgba(255,255,255,.65);overflow:hidden}
.ae:before{content:"";position:absolute;left:0;right:0;top:0;height:48px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.08))}
.ae .tb{position:relative;height:58px;display:flex;align-items:center;gap:12px;font:600 24px var(--ui);color:#0c2236;padding-left:6px}
.ae .bs{margin-left:auto;display:flex;gap:4px}
.ae .bs i{width:50px;height:32px;border-radius:6px;border:2px solid rgba(40,60,80,.45);background:linear-gradient(180deg,#f4f9fc,#c9dbe6 50%,#b3cbd9 51%,#dde9f0)}
.ae .bs i:last-child{width:82px;background:linear-gradient(180deg,#f3b9a6,#d9534a 50%,#c43b2f 51%,#e2806d);border-color:#7a1f15}
.ae .in{position:relative;background:#fff;border:2px solid #9fb3c3}
.tv{position:relative;width:100%;aspect-ratio:4/3;background:#000;overflow:hidden}
.tv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tv:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 5px)}
.ctl{display:flex;align-items:center;justify-content:center;gap:26px;height:104px;background:linear-gradient(180deg,#eef5fa,#cfe0eb)}
.ctl .c{width:48px;height:48px;border-radius:50%;background:linear-gradient(180deg,#fff,#bcd2e0);border:2px solid #8fa9bb}
.play{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:4px solid #fff;
 background:radial-gradient(circle at 50% 30%,#bff3ff 0,var(--cian) 45%,#0a4f8a 100%);box-shadow:0 0 26px var(--cian-glow)}
.play:after{content:"";border-left:26px solid #fff;border-top:16px solid transparent;border-bottom:16px solid transparent;margin-left:8px}
.prog{position:absolute;left:18px;right:18px;top:-14px;height:12px;border-radius:6px;background:#b8cddb;overflow:hidden}
.prog b{display:block;height:100%;background:linear-gradient(180deg,#9ff,var(--cian) 50%,#0a6fb5)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;background:rgba(255,255,255,.28);backdrop-filter:blur(12px);
 box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 12px 30px rgba(0,30,60,.3);font:800 44px var(--t);color:#fff;text-shadow:0 2px 6px rgba(0,40,80,.5);white-space:nowrap}
.chip:before{content:"";position:absolute;inset:0 0 50% 0;border-radius:40px 40px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05))}
.foto{position:absolute;background:#fff;padding:14px 14px 50px;box-shadow:0 24px 50px rgba(0,20,50,.45)}
.foto img{display:block;width:100%;height:100%;object-fit:cover}
.tip{position:absolute;padding:12px 24px;border-radius:12px;font:700 32px var(--ui);color:#0c2a44;white-space:nowrap;
 background:linear-gradient(180deg,#fff,#e4f1f9);border:2px solid #7fa7c4;box-shadow:0 10px 24px rgba(0,30,60,.35)}
.bar{position:relative;height:76px;border-radius:38px;background:rgba(255,255,255,.35);box-shadow:inset 0 2px 6px rgba(0,30,60,.25);overflow:hidden}
.bar b{position:absolute;left:0;top:0;bottom:0;border-radius:38px}
.bar b:after{content:"";position:absolute;left:12px;right:12px;top:6px;height:42%;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.1))}
.bl{display:flex;justify-content:space-between;font:800 40px var(--t);color:#fff;text-shadow:0 2px 6px rgba(0,40,80,.5);margin:0 10px 10px}
#cap{position:absolute;left:60px;right:150px;top:1395px;text-align:center;font:800 52px/1.18 var(--t);color:#fff;
 text-shadow:0 3px 0 rgba(0,25,45,.55),0 0 22px rgba(0,25,45,.6);text-wrap:balance}
#cap span{display:inline;padding:6px 18px;border-radius:16px;background:rgba(5,30,55,.38);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cursor{position:absolute;width:64px;height:88px;z-index:50;filter:drop-shadow(3px 4px 2px rgba(0,0,0,.4))}
</style></head>
<body><div id="stage"></div><div id="capw"></div>
<script>
{
const W=1080,H=1920,FPS=30;
const stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(u,a,b)=>clamp((u-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-k,3);
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eb=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const rnd=s=>{let x=Math.sin(s*9301+49297)*233280;return x-Math.floor(x)};
const pend=[];
const pad=n=>String(n).padStart(4,'0');

/* ---------- piezas comunes ---------- */
const noiseURL=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);
 for(let i=0;i<d.data.length;i+=4){const v=rnd(i*.37)*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c.toDataURL()})();
const ruido=()=>`<div class="ruido" style="background:url(${noiseURL});background-size:512px"></div><div class="scan"></div>`;
const moverRuido=(sc,t)=>{const r=sc.querySelector('.ruido');if(r){const f=Math.floor(t*FPS);r.style.transform=`translate(${(rnd(f)*200)|0}px,${(rnd(f+7)*200)|0}px)`}};
const paisaje=`<svg class="paisaje" viewBox="0 0 1080 820" preserveAspectRatio="none">
 <defs><linearGradient id="co" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4ec3a"/><stop offset=".4" stop-color="#80cd05"/><stop offset="1" stop-color="#3a8410"/></linearGradient>
 <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8be3fe"/><stop offset=".45" stop-color="#1a82cc"/><stop offset="1" stop-color="#0e466b"/></linearGradient></defs>
 <path d="M0 330 C 260 150, 640 120, 900 250 S 1080 320 1080 320 V820 H0Z" fill="url(#co)"/>
 <path d="M0 520 C 200 470, 380 580, 600 520 S 900 470, 1080 540 V820 H0Z" fill="url(#ag)"/>
 <path d="M0 600 C 230 560, 430 650, 660 600 S 950 580, 1080 620" stroke="#fff" stroke-width="10" fill="none" opacity=".7"/>
 <path d="M0 690 C 260 650, 480 740, 720 690 S 980 680, 1080 710" stroke="#ccf4c8" stroke-width="7" fill="none" opacity=".55"/></svg>`;
const flecha=`<svg class="cursor" viewBox="0 0 22 30"><path d="M1 1 V24 L7 18 L11 28 L15 26 L11 17 H19Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const mano=`<svg class="cursor" viewBox="0 0 25 30"><path d="M8 2 C8 .5 11 .5 11 2 V12 C11 10.5 14 10.5 14 12 V13 C14 11.5 17 11.5 17 13 V14 C17 12.5 20 12.5 20 14 V22 C20 26 17 29 13 29 H11 C8 29 6 27 4 24 L1 18 C0 16 2.5 14.5 4 16.5 L8 21Z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
const icoWarn=`<svg width="78" height="78" viewBox="0 0 34 34" style="flex:none"><path d="M17 2 L33 31 H1Z" fill="#ffd200" stroke="#9a7400" stroke-width="1.5"/><rect x="15.5" y="11" width="3" height="11" fill="#222"/><rect x="15.5" y="24.5" width="3" height="3" fill="#222"/></svg>`;
const icoErr=`<svg width="78" height="78" viewBox="0 0 34 34" style="flex:none"><circle cx="17" cy="17" r="15" fill="#e0301e" stroke="#8a1208" stroke-width="1.5"/><path d="M11 11 L23 23 M23 11 L11 23" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg>`;
const icoExe=`<svg width="78" height="78" viewBox="0 0 34 34" style="flex:none"><rect x="3" y="5" width="28" height="24" rx="2" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/><rect x="3" y="5" width="28" height="6" fill="#2a6fd6"/><circle cx="17" cy="20" r="5" fill="#80cd05" stroke="#3a8410"/></svg>`;
const xpWin=(id,x,y,w,title,icon,txt,btns)=>`<div class="xp" id="${id}" style="left:${x}px;top:${y}px;width:${w}px">
 <div class="tb">${title}<span class="x">✕</span></div><div class="bd">${icon}<div>${txt}</div></div>
 <div class="bt">${btns.map((b,i)=>`<button data-i="${i}">${b}</button>`).join('')}</div></div>`;
const aeWin=(id,x,y,w,title,inner)=>`<div class="ae" id="${id}" style="left:${x}px;top:${y}px;width:${w}px">
 <div class="tb">${title}<div class="bs"><i></i><i></i><i></i></div></div><div class="in">${inner}</div></div>`;
const player=(id,x,y,w,title)=>aeWin(id,x,y,w,'▶&nbsp; '+title,`<div class="tv"><img class="seq"></div><div class="ctl" style="position:relative"><div class="prog"><b></b></div><span class="c"></span><span class="c"></span><span class="play"></span><span class="c"></span><span class="c"></span></div>`);
const bubbles=(n,seed,size=[24,90])=>Array.from({length:n},(_,i)=>{const s=lerp(size[0],size[1],rnd(seed+i*3.1));return `<span class="burbuja" data-i="${i}" style="width:${s}px;height:${s}px"></span>`}).join('');
const subir=(sc,t,seed,speed=120)=>sc.querySelectorAll('.burbuja.up').forEach((b,i)=>{const x=rnd(seed+i)*1080,y0=rnd(seed+i*7)*2400,sp=speed*(.6+rnd(seed+i*13));
 const y=((y0-t*sp)%2400+2400)%2400-200;b.style.transform=`translate(${x+Math.sin(t*1.3+i)*18}px,${y}px)`});
const seq=(img,name,u,n,hold=true)=>{let f=Math.floor(u*FPS)+1;if(f>n)f=hold?n:((f-1)%n)+1;if(f<1)f=1;const src=`ad/${name}/${pad(f)}.jpg`;
 if(img.getAttribute('src')!==src){img.setAttribute('src',src);pend.push(img.decode().catch(()=>{}))}};
const ponerCursor=(el,x,y,show=true)=>{el.style.display=show?'block':'none';el.style.left=x+'px';el.style.top=y+'px'};


const SC=[];
const def=(t0,t1,html,up)=>{const d=document.createElement('div');d.className='sc';d.innerHTML=html;stage.appendChild(d);SC.push({t0,t1,el:d,up})};
const $=(sc,s)=>sc.querySelector(s);
/* ---------- personajes animados (originales, vector) ----------
   pj(id,x,y,h,o): o = {piel,pelo,remera,pantalon,zapas,adulto,celu,globo,flequillo}
   anim(el,t,modo): modo = 'idle' | 'salta' | 'camina' | 'corre' | 'saluda' | 'baila' | 'mira' (y suma parpadeo) */
const pj=(id,x,y,h,o={})=>{const a=o.adulto;const P=o.piel||'#f2c29b',H=o.pelo||'#4a2c17',R=o.remera||'#2f80ed',PA=o.pantalon||'#2b3a67',Z=o.zapas||'#fff';
 const hr=a?40:54, hy=a?58:66, ty=a?108:126, th=a?150:112, ly=ty+th-6, ll=a?150:112;
 return `<svg id="${id}" class="abs pj" style="left:${x}px;top:${y}px;overflow:visible" width="${h*.5}" height="${h}" viewBox="-100 0 200 400">
 <g class="cuerpo" style="transform-box:view-box;transform-origin:0px 400px">
  <ellipse cx="0" cy="396" rx="${a?58:64}" ry="8" fill="#000" opacity=".18" class="sombra"/>
  <g class="legL" style="transform-box:view-box;transform-origin:-16px ${ly}px"><rect x="-30" y="${ly}" width="26" height="${ll}" rx="12" fill="${PA}"/><rect x="-38" y="${ly+ll-16}" width="40" height="22" rx="10" fill="${Z}" stroke="#2b2f36" stroke-width="3"/></g>
  <g class="legR" style="transform-box:view-box;transform-origin:16px ${ly}px"><rect x="4" y="${ly}" width="26" height="${ll}" rx="12" fill="${PA}"/><rect x="-2" y="${ly+ll-16}" width="40" height="22" rx="10" fill="${Z}" stroke="#2b2f36" stroke-width="3"/></g>
  <rect class="rem" x="-42" y="${ty}" width="84" height="${th}" rx="30" fill="${R}"/><rect x="-42" y="${ty}" width="84" height="${th*.45}" rx="30" fill="#fff" opacity=".14"/>
  <g class="armL" style="transform-box:view-box;transform-origin:-38px ${ty+18}px"><rect class="rem" x="-54" y="${ty+8}" width="22" height="${a?120:96}" rx="11" fill="${R}"/><circle cx="-43" cy="${ty+(a?132:108)}" r="13" fill="${P}"/></g>
  <g class="armR" style="transform-box:view-box;transform-origin:38px ${ty+18}px"><rect class="rem" x="32" y="${ty+8}" width="22" height="${a?120:96}" rx="11" fill="${R}"/><circle cx="43" cy="${ty+(a?132:108)}" r="13" fill="${P}"/>
   ${o.celu?`<rect x="30" y="${ty+(a?112:88)}" width="30" height="50" rx="6" fill="#1d2025" stroke="#9aa5af" stroke-width="2"/><rect x="34" y="${ty+(a?117:93)}" width="22" height="36" rx="3" fill="#cfe6ff" class="pant"/>`:''}
   ${o.globo?`<line x1="43" y1="${ty+108}" x2="70" y2="-40" stroke="#555" stroke-width="2"/><ellipse cx="72" cy="-80" rx="42" ry="50" fill="${o.globo}"/><ellipse cx="58" cy="-98" rx="10" ry="16" fill="#fff" opacity=".5"/>`:''}</g>
  <g class="cabeza" style="transform-box:view-box;transform-origin:0px ${hy+hr}px">
   <rect x="-12" y="${hy+hr-8}" width="24" height="${ty-hy-hr+14}" fill="${P}"/>
   <circle cx="0" cy="${hy}" r="${hr}" fill="${P}"/>
   <path d="M${-hr-2} ${hy-4} C ${-hr} ${hy-hr-20}, ${hr} ${hy-hr-24}, ${hr+2} ${hy-6} C ${hr*.5} ${hy-hr*.55}, ${-hr*.4} ${hy-hr*.7}, ${-hr-2} ${hy-4}Z" fill="${H}"/>
   ${o.flequillo?`<path d="M${-hr*.8} ${hy-hr*.5} q ${hr*.4} ${hr*.5} ${hr*.8} 0 q ${hr*.4} ${hr*.5} ${hr*.8} 0" fill="${H}"/>`:''}
   <g class="ojos" style="transform-box:view-box;transform-origin:0px ${hy+2}px"><ellipse cx="${-hr*.36}" cy="${hy+2}" rx="${hr*.11}" ry="${hr*.15}" fill="#2b2f36"/><ellipse cx="${hr*.36}" cy="${hy+2}" rx="${hr*.11}" ry="${hr*.15}" fill="#2b2f36"/>
    <circle cx="${-hr*.33}" cy="${hy-2}" r="${hr*.04}" fill="#fff"/><circle cx="${hr*.39}" cy="${hy-2}" r="${hr*.04}" fill="#fff"/></g>
   <circle cx="${-hr*.58}" cy="${hy+hr*.32}" r="${hr*.14}" fill="#ff8a8a" opacity=".5"/><circle cx="${hr*.58}" cy="${hy+hr*.32}" r="${hr*.14}" fill="#ff8a8a" opacity=".5"/>
   <path class="boca" d="M${-hr*.28} ${hy+hr*.34} q ${hr*.28} ${hr*.3} ${hr*.56} 0" stroke="#7a2a1a" stroke-width="${a?4:5}" fill="none" stroke-linecap="round"/>
  </g></g></svg>`};
const rot=(el,s,d)=>{const g=el.querySelector(s);if(g)g.style.transform=`rotate(${d}deg)`};
const anim=(el,t,modo='idle',ph=0)=>{const T=t+ph;let by=0,L=0,R=0,aL=0,aR=0,hd=Math.sin(T*1.6)*3,sq=1;
 if(modo==='idle'){by=Math.sin(T*3)*3;aL=Math.sin(T*2)*4;aR=-aL}
 if(modo==='salta'){const s=Math.abs(Math.sin(T*6));by=-s*60;sq=1+(1-s)*.04;aL=-150+s*30;aR=150-s*30;L=-s*15;R=s*15}
 if(modo==='camina'||modo==='corre'){const f=modo==='corre'?11:6.5,am=modo==='corre'?38:24;L=Math.sin(T*f)*am;R=-L;aL=-L*1.1;aR=L*1.1;by=-Math.abs(Math.sin(T*f))*(modo==='corre'?14:6)}
 if(modo==='saluda'){by=Math.sin(T*3)*3;aR=-150+Math.sin(T*10)*22;aL=6}
 if(modo==='baila'){by=-Math.abs(Math.sin(T*5))*22;aL=-120+Math.sin(T*10)*40;aR=120-Math.sin(T*10+1)*40;hd=Math.sin(T*5)*10;L=Math.sin(T*5)*12;R=-L}
 if(modo==='mira'){by=Math.sin(T*2)*2;aR=-25;hd=12+Math.sin(T)*2}
 if(modo==='celu'){by=Math.sin(T*2)*2;aR=-62;aL=4;hd=18}
 el.querySelector('.cuerpo').style.transform=`translateY(${by}px) scaleY(${sq})`;rot(el,'.legL',L);rot(el,'.legR',R);rot(el,'.armL',aL);rot(el,'.armR',aR);rot(el,'.cabeza',hd);
 const bl=(T%3.1)<.12;el.querySelector('.ojos').style.transform=`scaleY(${bl?.12:1})`;
 const sh=el.querySelector('.sombra');sh.setAttribute('rx',String((el.querySelector('.cuerpo')?60:60)*(1+by/200)))};
/* chispas: estallido de estrellitas en un punto */
const chispas=(n,seed)=>Array.from({length:n},(_,i)=>`<svg class="abs chi" data-i="${i}" width="40" height="40" viewBox="-20 -20 40 40" style="opacity:0"><path d="M0 -18 L4 -4 L18 0 L4 4 L0 18 L-4 4 L-18 0 L-4 -4Z" fill="${['#fff6a8','#ffd23b','#ff7ac6','#7fe3ff','#c6ff5e'][i%5]}"/></svg>`).join('');
const estallar=(sc,sel,t,t0,cx,cy,seed=1,R=260)=>sc.querySelectorAll(sel+' .chi').forEach((c,i)=>{const k=seg(t,t0,t0+.7),a=rnd(seed+i*3.3)*6.283,r=eo(k)*R*(.4+rnd(seed+i)*.6);
